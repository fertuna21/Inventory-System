<!DOCTYPE html>
<html>
<head>
    <title>Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
         <style>
        /* Custom scrollbar for a cleaner look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 10px;
        }
        
        .sidebar-link:hover { background-color: #1F2937; color: white; }
     
        
        /* Smooth transition for sidebar links */
         
    </style>
</head>
<body class="flex min-h-screen">
    <aside class="w-64 bg-[#111827] text-gray-400 flex flex-col fixed h-full">
        <div class="p-8 text-white font-bold text-xl tracking-tight">
            ADMIN
        </div>
        
        <nav class="flex-1 px-4 space-y-2">
            <a href="{{ url_for('index') }}" class="sidebar-link flex items-center px-4 py-3 rounded-lg text-sm transition">
                 Home
            </a>
            <a href="{{ url_for('products') }}" class="sidebar-link flex items-center px-4 py-3 rounded-lg text-sm transition">
                 Products
            </a>
            <a href="{{ url_for('catalogues') }}" class="sidebar-link flex items-center px-4 py-3 rounded-lg text-sm transition">
                 Catalogues
            </a>
            <a href="{{ url_for('signup') }}" class="sidebar-link flex items-center px-4 py-3 rounded-lg text-sm transition">
                Sign Up
            </a>
        </nav>

         
    </aside>


    <main class="ml-64 min-h-screen p-12">
        <div class="max-w-6xl mx-auto">
            
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-4xl font-bold text-slate-800 tracking-tight">Full Activity Log</h1>
                     
                </div>
                <a href="{{ url_for('index') }}" class="text-blue-600 hover:text-blue-800 font-medium text-sm flex items-center">
                    <i class="fa fa-arrow-left mr-2"></i> Back to Dashboard
                </a>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto max-h-[70vh] overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 sticky top-0 z-10 border-b border-gray-200">
                            <tr>
                                <th class="px-8 py-5 text-xs font-bold text-gray-500 uppercase tracking-wider">Event Details</th>
                                <th class="px-8 py-5 text-xs font-bold text-gray-500 uppercase tracking-wider">Type</th>
                                <th class="px-8 py-5 text-xs font-bold text-gray-500 uppercase tracking-wider text-right">Time</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            {% for note in all_notes %}
                            <tr class="hover:bg-gray-50/50 transition-colors">
                                <td class="px-8 py-5">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 flex items-center justify-center rounded-xl 
                                            {% if 'sale' in note.type %} bg-green-100 text-green-600 
                                            {% elif 'product' in note.type %} bg-blue-100 text-blue-600 
                                            {% else %} bg-gray-100 text-gray-500 {% endif %}">
                                            <i class="fa 
                                                {% if 'sale' in note.type %} fa-shopping-cart 
                                                {% elif 'product' in note.type %} fa-box 
                                                {% else %} fa-info-circle {% endif %}"></i>
                                        </div>
                                        <span class="text-sm font-medium text-gray-700">{{ note.message | safe }}</span>
                                    </div>
                                </td>
                                <td class="px-8 py-5">
                                    <span class="text-[10px] uppercase font-black px-2.5 py-1 rounded-md bg-gray-100 text-gray-600 tracking-widest border border-gray-200">
                                        {{ note.type }}
                                    </span>
                                </td>
                                <td class="px-8 py-5 text-right text-sm text-gray-500 font-medium">
                                   {{ note.display_time.strftime('%I:%M %p, %b %d, %Y') }}
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="3" class="px-6 py-20 text-center text-gray-400 italic">
                                    <i class="fa fa-history block text-3xl mb-3 opacity-20"></i>
                                    No history found.
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
