<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back</h2>
        <p class="text-gray-500 text-sm mb-8">Please enter your details to access the inventory.</p>
{% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="bg-red-50 text-red-600 p-3 rounded-lg text-xs font-bold mb-4">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" class="space-y-6">
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-500 tracking-widest block mb-2">Username</label>
                <input type="text" name="username" required class="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-gray-900 transition-all">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-500 tracking-widest block mb-2">Password</label>
                <input type="password" name="password" required class="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-gray-900 transition-all">
            </div>
            
            <button type="submit" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition-all">Sign In</button>
        </form>
        
        <p class="mt-8 text-center text-sm text-gray-500">
            Don't have an account? <a href="{{ url_for('signup') }}" class="text-gray-900 font-bold">Sign up</a>
        </p>
    </div>
</body>
</html>
